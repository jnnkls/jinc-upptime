<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jinc.io Status</title>
<meta name="description" content="Live availability and incident history of jinc.io services.">
<link rel="stylesheet" href="/style.css">
<link rel="alternate" type="application/atom+xml" title="jinc.io Status" href="/feed.xml">
</head>
<body>
<main>
  <header>
    <h1><a href="/">jinc.io <span>Status</span></a></h1>
    <nav><a href="/" aria-current="page">Status</a><a href="/incidents/">Incidents</a><a href="/uptime/">Uptime</a><a href="/feed.xml">Feed</a></nav>
  </header>
  <div id="banner" class="banner loading">Loading status…</div>
  <div id="active"></div>
  <div id="components" class="card" aria-label="Services"></div>
  <h2>Past Incidents</h2>
  <div id="history"><p class="none">Loading…</p></div>
  <p><a href="/incidents/">Incident History →</a></p>
  <footer>Checked every 5 minutes from GitHub Actions · Powered by <a href="https://upptime.js.org">Upptime</a></footer>
</main>
<script src="/common.js"></script>
<script>
const DAYS = 90, HISTORY_DAYS = 14;

function lastDays(n) {
  const today = new Date(); today.setUTCHours(0, 0, 0, 0);
  return Array.from({ length: n }, (_, i) => dayKey(new Date(today - (n - 1 - i) * 864e5)));
}
function overall(sites) {
  const bad = sites.filter((s) => s.status !== "up").length;
  if (!bad) return ["up", "All Systems Operational"];
  if (bad * 2 >= sites.length) return ["major", "Major Outage"];
  return ["minor", bad === 1 ? "Partial Outage" : "Partial System Outage"];
}

function renderComponents(sites) {
  const days = lastDays(DAYS), tracked = days.filter((d) => d >= DATA_START);
  const box = $("components"); box.replaceChildren();
  for (const s of sites) {
    const dmd = s.dailyMinutesDown || {};
    const down = tracked.reduce((sum, d) => sum + (dmd[d] || 0), 0);
    const pct = tracked.length ? (100 - (down / (tracked.length * 1440)) * 100).toFixed(2) : "100.00";
    const c = el("div", "component");
    const row = el("div", "row");
    row.append(link(s.name, s.url, "name"), el("span", "state " + s.status, STATE_TEXT[s.status] || s.status));
    const bars = el("div", "bars"); bars.setAttribute("aria-hidden", "true");
    for (const d of days) {
      const b = el("div", `bar ${level(d, dmd[d])}-bg`);
      b.dataset.tipDay = d; b.dataset.min = dmd[d] || 0;
      bars.append(b);
    }
    const legend = el("div", "legend");
    legend.append(el("span", "from"), el("span", "line"), el("span", null, `${pct} % uptime`), el("span", "line"), el("span", null, "Today"));
    c.append(row, bars, legend, el("span", "sr", `${pct} percent uptime over the last ${DAYS} days`));
    box.append(c);
  }
}

function renderIncidents(incidents) {
  const open = incidents.filter((i) => i.state === "open");
  const act = $("active"); act.replaceChildren();
  if (open.length) { const card = el("div", "card"); open.forEach((i) => card.append(incidentEl(i))); act.append(card); }
  const hist = $("history"); hist.replaceChildren();
  for (const d of lastDays(HISTORY_DAYS).reverse()) {
    const day = el("div", "day"); day.append(el("h4", null, fmtDay(d)));
    const list = incidents.filter((i) => i.state === "closed" && i.createdAt.slice(0, 10) === d);
    if (list.length) list.forEach((i) => day.append(incidentEl(i)));
    else day.append(el("p", "none", "No incidents reported."));
    hist.append(day);
  }
}

async function load() {
  const incidents = getJSON("/incidents/recent.json").then((d) => d.incidents).catch(() => null);
  const overrides = getJSON("/incidents/overrides.json").then((d) => d.incidents).catch(() => []);
  try {
    const sites = applyIncidents(applyOverrides(await loadSummary(), await overrides), (await incidents) || []);
    if (await incidents) applyLiveStatus(sites, await incidents);
    const [cls, text] = overall(sites);
    $("banner").className = "banner " + cls; $("banner").textContent = text;
    renderComponents(sites);
  } catch {
    $("banner").className = "banner loading"; $("banner").textContent = "Status data could not be loaded.";
  }
  if (await incidents) renderIncidents(await incidents);
  else $("history").replaceChildren(el("p", "none", "Incident history could not be loaded."));
}
initTooltip();
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
