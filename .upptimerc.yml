# Change these first
owner: jnnkls # Your GitHub organization or username, where this repository lives
repo: jinc-upptime # The name of this repository

sites:
  - name: homepage
    url: https://jnnkls.dev
  - name: joshirando.de
    url: https://joshirando.de
    headers:
      - "X-Upptime-Token: $UPPTIME_WAF_TOKEN" # passes the zone's IP/geo WAF block
  - name: Mail
    url: https://mail.jinc.io
  - name: ID (SSO)
    url: https://id.jinc.io
  - name: ntfy
    url: https://ntfy.jinc.io/v1/health
  - name: Bastion
    url: https://bastion.jinc.io
    expectedStatusCodes: [401] # behind basic auth, 401 means up
  - name: Matrix
    url: https://matrix.jnnkls.wtf/_matrix/client/versions
  - name: Immich
    url: https://immich.jinc.io/api/server/ping
  - name: n8n
    url: https://n8n.jinc.io/healthz
  - name: HedgeDoc
    url: https://hedgedoc.jinc.io
  - name: Rallly
    url: https://rallly.jinc.io
  - name: Atuin
    url: https://atuin.jinc.io
  - name: Gist
    url: https://gist.jinc.io/-/all
  - name: Drop
    url: https://drop.jinc.io
  - name: Watchbin
    url: https://watchbin.jinc.io
  - name: Braid
    url: https://braid.jinc.io/auth/login
  - name: VERT
    url: https://vert.jinc.io
  - name: Hoppscotch
    url: https://hoppscotch.jinc.io
  - name: PDF
    url: https://pdf.jinc.io
  - name: Slink
    url: https://slink.jinc.io/explore
  - name: Cinny
    url: https://cinny.jnnkls.wtf
  - name: ByteStash
    url: https://bytestash.jinc.io
  - name: Rybbit
    url: https://rybbit.jinc.io
  - name: damast.dev
    url: https://damast.dev
  - name: quic.run
    url: https://quic.run
  - name: textfsm101.com
    url: https://textfsm101.com

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.jinc.io
  # baseUrl: /your-repo-name
  name: jinc.io Status
  introTitle: "**jinc.io** service status"
  introMessage: Live availability of jinc.io services, checked externally every 5 minutes. Outages and maintenance are listed below as incidents.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
